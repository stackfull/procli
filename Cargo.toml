[package]
name = "procli"
version = "0.1.2"
description = "Process management CLI for development systems"
authors = ["Paul <paul@stackfull.com>"]
license = "MIT"
edition = "2024"
readme = "README.md"
repository = "https://github.com/stackfull/procli"
homepage = "https://github.com/stackfull/procli"
categories = ["command-line-utilities", "development-tools", "visualization"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
crossterm = { version = "0.29.0"}
ratatui = "0.30.0"
tokio = { version = "1.40.0", features = ["rt", "rt-multi-thread", "sync", "time", "process", "io-util", "macros"] }
color-eyre = "0.6.3"
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.9.11"
clap = { version = "4.5.55", features = ["derive"] }
notify = { version = "8.2.0", features = ["serde"] }
# tui-logger = { version = "0.18.1", features = ["crossterm"] }
log = { version = "0.4.29", features = ["kv_serde"]}
shlex = "1.3.0"
uuid = { version = "1.20.0", features = ["v4"]}
sysinfo = "0.38.0"
rat-salsa = { version = "4.0.2", features = ["async", "rat-widget"] }
rat-widget = { version = "3.1.1", features = ["cli-clipboard"] }


# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
